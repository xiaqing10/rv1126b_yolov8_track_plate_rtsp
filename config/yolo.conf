# ============================================================
# yolo_rtsp 配置文件 (key = value)
#
# 规则:
#   - 每行一个 "key = value" 参数
#   - 写值时不要在行尾加注释; 所有说明都用单独以 '#' 开头的注释行
#   - 命令行参数会覆盖这里的值; 改动后需重启程序生效
#   - 布尔开关统一用 1=开 / 0=关
#
# 本文件为"主码流 + 车牌/车辆识别"的完整配置模板。
# 识别引擎可在 car_plate_type 处切换 rec(车牌+颜色) / lprnet(仅车牌号)。
# ============================================================

# ---- 输入源 ----
# 摄像头模式: 注释掉 video 行(或留空), 使用实时摄像头
# 文件回放模式: 设置 video 为 .h264/.h265 裸流路径(MP4 需先用 ffmpeg 转裸流)
video = /userdata/yolo/test.h264
codec = h264
file_fps = 25

# ---- YOLO 检测模型 / 标签 ----
# 主 YOLOv8 检测模型路径 (rknn 格式, 板端实际路径)
#model  = /userdata/yolo/models/yolov8s_80_rv1126b.rknn
# 备用检测模型(按需启用, 用 '#model' 切换)
model  = /userdata/yolo/models/kezhu-det_ultralytics_yolov8_rv1126b.rknn
# 类别标签文件路径 (每行一个类别名, 与模型类别顺序一致)
labels = /userdata/yolo/models/labels/coco_80_labels_list.txt
# 类别数: 0=自动从模型输出推断; 非 0=强制指定
class_num = 0
# 检测置信度阈值(0~1), 低于该值的框被丢弃, 越小检出越多但误检越多
conf_thresh = 0.25
# NMS 非极大值抑制阈值(0~1), 用于合并重叠框, 越大保留越多重叠框
nms_thresh  = 0.45

# ---- 跟踪器 (bytetrack | deepsort) ----
# bytetrack: 速度优先, 无 ReID 模型, 依赖运动+IoU 关联 (默认)
# deepsort : 外观+运动级联匹配, 用 ReID 模型提取目标外观特征, 抗遮挡/重识别更好
#            需额外 ReID 模型(osnet), 特征异步推理(滞后一帧, 不影响主线程 NPU 帧率)
tracker = bytetrack
# DeepSORT ReID 模型 (仅 tracker=deepsort 时生效)
#   切换模型只需改 reid_model; 特征维数 reid_dim 会自动从模型输出读取, 无需手动改。
#   reid_w / reid_h 为模型输入尺寸, 需与实际模型一致 (osnet 系列均为 128x256)。
#   osnet_x0_25_market.rknn : 128x256, 512 维 (小模型, 更快但精度略低)
#   osnet_x1_0_imagenet.rknn: 128x256, 512 维 (大模型, 精度更高)
reid_model = /userdata/yolo/models/osnet_x1_0_imagenet.rknn
reid_dim = 512
reid_w = 128
reid_h = 256
# ReID 推理节流: 每隔 N 帧才对全部目标做一次 ReID 推理 (>=1)。
#   ReID 与 YOLO 共用同一颗 NPU (串行), 每帧全量推理会把帧率拖低;
#   间隔越大 NPU 越让给 YOLO, 帧率越高, 但特征更新越滞后 (跟踪略迟钝)。
#   建议 2-5; 设为 1 表示每帧都推理 (等同于原来的全量行为)。
reid_interval = 3

# ---- ISP IQ 文件目录(摄像头模式必须) ----
iq_dir = /oem/usr/share/iqfiles

# ---- 主码流(编码 + RTSP) ----
# 主码流宽(像素), 编码与推流分辨率
width   = 1920
# 主码流高(像素)
height  = 1080
# 编码格式: h264 或 h265
codec   = h264
# 编码码率(kbps), 越大画面越清晰但码流越大
bitrate = 12000

# ---- 摄像头 VI 源分辨率(传感器原生, 默认 4K) ----
# VI 输出该分辨率喂给 VPSS, 再缩放成主码流/AI/车牌三路
vi_w = 3840
vi_h = 2160

# ---- 车牌/车辆识别 (car_enable=1 启用) ----
# 识别帧从 VPSS 车牌通道取, 源分辨率(4K), 在下方 ROI(源帧坐标 0~3840 x 0~2160)内做
# 车牌+车辆识别, 结果绑定到 YOLO 车辆 track_id 并在 OSD 叠加。
# ROI 需按实际安装场景调整到车辆经过的区域。
# 总开关: 1=启用车牌/车辆识别, 0=关闭
car_enable = 0
# 车牌取帧通道(VPSS 通道号, 固定为 2)
car_chn = 2
# 识别间隔(ms): 每 N 毫秒对 ROI 抽一帧做一次车牌/车身色识别
car_interval_ms = 1000
# 车牌号码识别引擎:
#   rec   = car_recognition 的 plate_rec(识别车牌号 + 车牌颜色)
#   lprnet= LPRNet(仅识别车牌号, 不输出车牌颜色)
# 用 lprnet 时 car_plate_model 需指向 lprnet.rknn
car_plate_type = rec
# ROI 左上角 X (0-1 归一化, 相对源帧; 0~1)
car_roi_x = 0
# ROI 左上角 Y (0-1 归一化, 相对源帧; 0~1)
car_roi_y = 0.185
# ROI 宽度 (0-1 归一化; 1 = 整幅宽)
car_roi_w = 1.0
# ROI 高度 (0-1 归一化; 1 = 整幅高)
car_roi_h = 0.556
# 车牌检测模型路径 (detect.rknn, 负责检测车牌/车辆/两轮车)
car_detect_model = /userdata/yolo/models/detect.rknn
# 车牌号码识别模型路径:
#   car_plate_type=rec    -> plate_rec_color.rknn / plate_rec_color_fp.rknn
#   car_plate_type=lprnet -> lprnet.rknn
# 注: 量化版 plate_rec_color.rknn 对实时小图置信度塌陷(约3%), 改用官方自带浮点版
#     plate_rec_color_fp.rknn 可显著提升置信度与省份字准确率。
car_plate_model = /userdata/yolo/models/plate_rec_color_fp.rknn
# 车身颜色识别模型路径 (car_recognition.rknn)
car_car_model = /userdata/yolo/models/car_recognition.rknn
# ---- 车牌检测阈值 (可调) ----
# 车牌检测置信度阈值 (过低会漏检, 过高会误检)
car_conf_thresh = 0.3
# 车牌检测全局 NMS 阈值
car_nms_thresh = 0.5
# 车牌类专用低阈值 NMS, 合并重叠的同类别车牌框 (设小合并更激进)
car_plate_nms_thresh = 0.1

# ---- 车牌/车色 计票择优 (抗误识别) ----
# 同一 track_id 需连续 N 次识别到相同车牌才采信(写入 OSD/结果); 冲突则扣票, 抵抗单次误识别。
# 车牌采信阈值 (连续一致票数), 越大越稳但出结果越慢
car_plate_vote = 3
# 车色采信阈值 (车色变化少, 可更宽松)
car_color_vote = 2
# track 属性条目存活帧数(约3s@30fps), 超时清空防 id 复用串数据
car_track_age = 90
# 车牌->车辆 IOU 关联阈值 (同一坐标系)
car_match_iou = 0.1

# ---- RTSP ----
# RTSP 监听端口
port = 8554
# RTSP 流路径
path = /live/0
# 是否开启 RTSP 推流(1=开 0=关); 关闭时只排空编码流不发送网络, 用于排查推流是否影响检测帧率
push_stream = 1

# ---- 日志输出 ----
# debug=1 打印所有调试信息(检测框/车牌识别详细); debug=0 只打印帧率与检测到的车牌
debug = 0
# 运行统计日志打印间隔(秒): 每隔该秒数打印一次 fps + 检测/跟踪/车牌平均耗时
#   输出示例: [FPS] 20.0 fps objs=3 | infer=45.00ms track=1.20ms car=180.0ms (avg over 5.0s, 100 frames)
#   设 0 禁用该统计打印
print_interval_s = 5

# ---- OSD 叠加(1=显示 0=关闭) ----
# 是否显示日期时间 OSD
show_osd = 1
# 是否显示帧率/目标数 OSD
show_fps = 1
# OSD 文字放大倍数(1~4), 数值越大字越大, 默认 2
osd_scale = 2
# 车牌号文字放大倍数(独立于 osd_scale), 默认 1
osd_plate_scale = 1
# OSD 日期/帧率文字颜色: white/black/red/green/blue/yellow/cyan/magenta 或 0xRRGGBBAA
osd_color = yellow

# ---- 车牌显示开关 ----
# show_plate = 1: 在对应 track_id 的车辆框上追加车牌号, 并绘制车牌实际位置的独立检测框
# show_plate = 0: 不显示任何车牌内容(默认)
show_plate = 0

# ---- 车牌检测图片保存 ----
# save_plate_image = 1: 检出车牌时把整帧 + 车牌裁剪保存为 JPEG
# plate_image_path: 保存目录(自动创建), 默认 /userdata/yolo/captures/
# plate_image_interval: 保存限频(ms), 两次保存最小间隔, 避免每帧刷屏卡顿
save_plate_image = 0
plate_image_path = /userdata/yolo/captures/
plate_image_interval = 5000

# ---- 主线程检测 ROI (0-1 归一化, 相对整幅; 全 0 = 整幅不裁剪) ----
# VPSS chn1 硬件"源图裁剪 -> 缩放", 放大 ROI 内目标提升检测; 检测结果回归到整幅坐标
# 与 OSD 显示。ROI 外区域不参与主检测(无轨迹框), 但车牌识别(car_roi)独立可检出。
main_roi_x = 0
main_roi_y = 0
main_roi_w = 0
main_roi_h = 0

# ---- TCP + NDJSON 输出 (检测/跟踪数据下行) ----
# tcp_enable=1 时监听 tcp_port, 向连接的客户端以 NDJSON (每行一个 JSON) 发送:
#   frame       每帧跟踪结果 (全类别, "cls" 为数字, "box" 为 0-1 归一化)
#   detection   最近一次车牌/车辆原始识别 (rect 归一化到整幅)
# 供上层平台/算法解析; 慢客户端会被丢弃不影响主流程。
tcp_enable = 0
tcp_port = 9000
tcp_max_clients = 4

